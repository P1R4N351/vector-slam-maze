[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-slam-maze"
version = "0.4.4"
description = "Persistent multi-session NavMapGrid + visual-inertial pose-graph SLAM, ROS 2/ORB-SLAM3/RTAB-Map sensor bridge, camera characterization, and maze solver for Anki Vector"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
ros2 = ["rclpy"]
rosbag = ["rosbags>=0.9"]

[project.scripts]
vector-slam = "vector_slam_maze.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["vector_slam_maze*"]
